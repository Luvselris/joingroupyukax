<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard ♡ yukax</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-color: #E3F1FB;
      --card-blue-1: #A8D0EF;
      --card-blue-2: #C1E4F3;
      --cream-accent: #FFF9E6;
      --deep-accent: #99C3E4;
      --text-dark: #2c4257;
      --text-sub: #54718a;
      --white: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Quicksand', 'Mitr', sans-serif; }
    body {
      background-color: var(--bg-color);
      color: var(--text-dark);
      min-height: 100vh;
      padding: 24px 16px 80px;
      display: flex;
      justify-content: center;
    }
    .container { width: 100%; max-width: 440px; }
    #loginView { min-height: 75vh; display: flex; flex-direction: column; justify-content: center; }
    .card-panel {
      background: var(--white);
      border-radius: 26px;
      padding: 28px 22px;
      box-shadow: 0 8px 26px rgba(153, 195, 228, 0.35);
      border: 1.5px solid var(--card-blue-2);
      margin-bottom: 16px;
    }
    .panel-title {
      font-size: 16px; font-weight: 700;
      color: var(--text-dark); margin-bottom: 14px;
    }
    .field-label {
      font-size: 12px; font-weight: 600;
      color: var(--text-sub); display: block; margin-bottom: 5px;
    }
    .input-box, .textarea-box {
      width: 100%; padding: 12px 14px;
      border: 1.5px solid var(--card-blue-2);
      border-radius: 16px; font-size: 13.5px;
      background: var(--white); color: var(--text-dark);
      outline: none; margin-bottom: 12px;
    }
    .input-box:focus, .textarea-box:focus {
      border-color: var(--deep-accent);
    }
    .btn-main {
      width: 100%;
      background: var(--deep-accent);
      color: #fff; border: none; padding: 13px;
      border-radius: 18px; font-size: 14.5px;
      font-weight: 600; cursor: pointer;
      box-shadow: 0 4px 14px rgba(153, 195, 228, 0.5);
    }
    .btn-logout {
      background: var(--white);
      border: 1.5px solid var(--card-blue-1);
      color: var(--text-dark);
      padding: 6px 14px; border-radius: 14px;
      font-size: 12px; font-weight: 600; cursor: pointer;
    }
    #dashboardView { display: none; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  </style>
</head>
<body>

  <div class="container">

    <!-- Login -->
    <div id="loginView">
      <div class="card-panel" style="text-align: center;">
        <h2 style="margin-bottom: 18px; font-size: 20px;">Admin Login</h2>
        <form onsubmit="handleAuth(event)">
          <input type="email" id="email" class="input-box" placeholder="email" required autocomplete="off">
          <input type="password" id="password" class="input-box" placeholder="password" required autocomplete="off">
          <button type="submit" class="btn-main">เข้าสู่ระบบ</button>
          <p id="authError" style="color:#e05260; font-size:12px; margin-top:10px; display:none;">ข้อมูลเข้าสู่ระบบไม่ถูกต้อง</p>
        </form>
      </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboardView">
      <div class="top-bar">
        <div style="font-weight: 700; font-size: 17px;">yukax Admin Control</div>
        <button type="button" class="btn-logout" onclick="logout()">ออกจากระบบ</button>
      </div>

      <div class="card-panel">
        <div class="panel-title">รูปภาพและหัวข้อ</div>
        
        <label class="field-label">ลิงก์แบนเนอร์ (GIF หรือ รูป):</label>
        <input type="url" id="bannerInp" class="input-box" placeholder="https://files.catbox.moe/dwcbgi.gif">

        <label class="field-label">ลิงก์รูปโปรไฟล์:</label>
        <input type="url" id="profileInp" class="input-box" placeholder="https://files.catbox.moe/x9khby.jpeg">

        <label class="field-label">หัวข้อหลัก:</label>
        <input type="text" id="titleInp" class="input-box" placeholder="join group yukax">

        <label class="field-label">กล่องคำอธิบาย:</label>
        <textarea id="descInp" class="textarea-box" rows="5"></textarea>

        <label class="field-label">ข้อความในกล่องกดคัดลอก:</label>
        <input type="text" id="copyNoteInp" class="input-box" placeholder="เข้ากลุ่มโค้ดยูกะ">
      </div>

      <div class="card-panel">
        <div class="panel-title">ช่องทางติดต่อ & บัญชี</div>

        <label class="field-label">ชื่อกล่องไลน์:</label>
        <input type="text" id="lineTitleInp" class="input-box" placeholder="line  :  @632wdjwj">

        <label class="field-label">ลิงก์ไลน์:</label>
        <input type="url" id="lineUrlInp" class="input-box" placeholder="https://lin.ee/xxbDtqv">

        <label class="field-label">ชื่อบัญชี:</label>
        <input type="text" id="accOwnerInp" class="input-box" placeholder="name : พนัชศกร ห.">

        <label class="field-label">เลขบัญชี ธนาคารกสิกรไทย:</label>
        <input type="text" id="kbankInp" class="input-box" placeholder="201-8-78539-6">

        <label class="field-label">เลขบัญชี วอลเลต:</label>
        <input type="text" id="walletInp" class="input-box" placeholder="063-992-2026">
      </div>

      <div class="card-panel">
        <div class="panel-title">รูปโพสต์ & คำกำกับ</div>

        <label class="field-label">ลิงก์รูปภาพโพสต์:</label>
        <input type="url" id="postImgInp" class="input-box" placeholder="https://files.catbox.moe/l5yh01.jpeg">

        <label class="field-label">กล่องคำกำกับใต้รูป:</label>
        <textarea id="noticeInp" class="textarea-box" rows="3"></textarea>

        <label class="field-label">ลิงก์เพลง (.mp3):</label>
        <input type="url" id="musicInp" class="input-box" placeholder="ใส่ลิงก์เพลง">
      </div>

      <button type="button" class="btn-main" id="saveBtn" style="padding:14px; margin-bottom:20px;" onclick="saveAll()">
        บันทึกข้อมูลขึ้นระบบทันที
      </button>
    </div>

  </div>

  <script>
    const DB_COLLECTION = "yukax_site_data";
    const DB_DOC = "main_content";

    // เข้ารหัส SHA-256 เพื่อความปลอดภัย ไม่เปิดเผยข้อความตรงในหน้าโค้ด
    const HASH_EMAIL = "8227b9c9f280a87aee824c93557e4526d15a519fc0f15c4864fa915720054045";
    const HASH_PASS = "1eb889aa360f04c6ca9b4df9b4f9811f5fe047817eb48166c303f269da79bead";

    async function sha256(str) {
      const buffer = new TextEncoder().encode(str);
      const hash = await crypto.subtle.digest('SHA-256', buffer);
      return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    const firebaseConfig = {
      apiKey: "AIzaSyCpAGDSy1NRgmLV_g7qJrCpwOhU9MrfQyY",
      authDomain: "benefitie.firebaseapp.com",
      projectId: "benefitie",
      storageBucket: "benefitie.firebasestorage.app",
      messagingSenderId: "270365672215",
      appId: "1:270365672215:web:230d1491091e26ce83ed52"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let siteData = {
      banner: "https://files.catbox.moe/dwcbgi.gif",
      profile: "https://files.catbox.moe/x9khby.jpeg",
      pageTitle: "join group yukax",
      desc: "𝒫rice   25   baht ⠀♡\n\nโน้ตสลิป    “  เข้ากลุ่มโค้ดยูกะ  ”\nลืมโน้ต โอนเพิ่ม1฿ พร้อมโน้ต\n\nโอนแล้วแจ้งสลิปได้เลย\nแล้วรอยูส่งรหัสเข้ากลุ่มให้ค่ะ",
      copyNote: "เข้ากลุ่มโค้ดยูกะ",
      lineTitle: "line  :  @632wdjwj",
      lineUrl: "https://lin.ee/xxbDtqv",
      accOwner: "name : พนัชศกร ห.",
      kbankNum: "201-8-78539-6",
      walletNum: "063-992-2026",
      postImg: "https://files.catbox.moe/l5yh01.jpeg",
      notice: "ลูกค้าที่สนใจเข้ากลุ่มยูรบกวนอ่านป้ายก่อนนะคะเพื่อความเข้าใจกัน หากสงสัยเพิ่มเติมสามารถสอบถามก่อนได้ค่ะ",
      musicUrl: "https://file.garden/asG8Gt-rqWIpi3II/Wistoria%20Wand%20and%20Sword%20Season%202%20Full%20Opening%20Lyrics%20Believers%20ASH%20DA%20HERO.mp3"
    };

    window.onload = function() {
      if (sessionStorage.getItem('yukax_auth') === 'true') {
        showDashboard();
      }
    };

    async function handleAuth(e) {
      e.preventDefault();
      const mail = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value.trim();

      const mailH = await sha256(mail);
      const passH = await sha256(pass);

      if (mailH === HASH_EMAIL && passH === HASH_PASS) {
        sessionStorage.setItem('yukax_auth', 'true');
        showDashboard();
      } else {
        document.getElementById('authError').style.display = 'block';
      }
    }

    function logout() {
      sessionStorage.removeItem('yukax_auth');
      location.reload();
    }

    async function showDashboard() {
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('dashboardView').style.display = 'block';

      try {
        const doc = await db.collection(DB_COLLECTION).doc(DB_DOC).get();
        if (doc.exists) siteData = { ...siteData, ...doc.data() };
      } catch(err) {}

      document.getElementById('bannerInp').value = siteData.banner || '';
      document.getElementById('profileInp').value = siteData.profile || '';
      document.getElementById('titleInp').value = siteData.pageTitle || '';
      document.getElementById('descInp').value = siteData.desc || '';
      document.getElementById('copyNoteInp').value = siteData.copyNote || '';
      document.getElementById('lineTitleInp').value = siteData.lineTitle || '';
      document.getElementById('lineUrlInp').value = siteData.lineUrl || '';
      document.getElementById('accOwnerInp').value = siteData.accOwner || '';
      document.getElementById('kbankInp').value = siteData.kbankNum || '';
      document.getElementById('walletInp').value = siteData.walletNum || '';
      document.getElementById('postImgInp').value = siteData.postImg || '';
      document.getElementById('noticeInp').value = siteData.notice || '';
      document.getElementById('musicInp').value = siteData.musicUrl || '';
    }

    async function saveAll() {
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.textContent = 'กำลังบันทึกข้อมูล... ⏳';

      siteData.banner = document.getElementById('bannerInp').value.trim();
      siteData.profile = document.getElementById('profileInp').value.trim();
      siteData.pageTitle = document.getElementById('titleInp').value.trim();
      siteData.desc = document.getElementById('descInp').value;
      siteData.copyNote = document.getElementById('copyNoteInp').value.trim();
      siteData.lineTitle = document.getElementById('lineTitleInp').value.trim();
      siteData.lineUrl = document.getElementById('lineUrlInp').value.trim();
      siteData.accOwner = document.getElementById('accOwnerInp').value.trim();
      siteData.kbankNum = document.getElementById('kbankInp').value.trim();
      siteData.walletNum = document.getElementById('walletInp').value.trim();
      siteData.postImg = document.getElementById('postImgInp').value.trim();
      siteData.notice = document.getElementById('noticeInp').value;
      siteData.musicUrl = document.getElementById('musicInp').value.trim();

      try {
        await db.collection(DB_COLLECTION).doc(DB_DOC).set(siteData);
        alert('✨ บันทึกข้อมูลสำเร็จเรียบร้อยแล้วค่ะ!');
      } catch(err) {
        alert('เกิดข้อผิดพลาดในการบันทึก กรุณาลองใหม่อีกครั้ง');
      } finally {
        btn.disabled = false;
        btn.textContent = 'บันทึกข้อมูลขึ้นระบบทันที';
      }
    }
  </script>
</body>
</html>
